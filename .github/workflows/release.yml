name: Auto Release

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  auto-release:
    # contents: push the tag and create the Release; actions: start the image
    # build on it, since a tag pushed with GITHUB_TOKEN triggers no run.
    permissions:
      contents: write
      actions: write
    uses: mbologna/.github/.github/workflows/auto-release.yml@ce1db2ef60f24345ab930d7434672fcd99556804 # main
    with:
      strategy: conventional
      image: docker.io/mbologna/saltstack-master
      # Both images for the fresh rebuild: a release cut when either image's
      # distribution has fixes its rebuild would pick up.
      images: docker.io/mbologna/saltstack-master=Dockerfile-master docker.io/mbologna/saltstack-minion=Dockerfile-minion
      dockerfiles: Dockerfile-master Dockerfile-minion
      # Tags carry the pinned Salt as SemVer build metadata (v1.1.0+up3006.0),
      # as mbologna/.github's VERSIONING.md describes.
      metadata_command: printf 'up%s' "$(sed -n 's/^ARG SALT_VERSION=//p' Dockerfile-master)"
      # The images build in build-and-push.yml. Dispatching this workflow on
      # the tag instead re-ran auto-release there: 995 tags on 2026-10-18.
      dispatch_workflow: build-and-push.yml
    secrets: inherit
